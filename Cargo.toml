[package]
name = "rzpk"
version = "0.1.0"
edition = "2024"
description = "A small, keyboard-first terminal file browser"
license = "MIT"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
unicode-width = "0.2"
