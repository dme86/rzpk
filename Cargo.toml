[package]
name = "rzpk"
version = "0.1.0"
edition = "2024"
description = "A small, keyboard-first terminal file browser"
license = "MIT"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
unicode-width = "0.2"
tar = "0.4"
flate2 = "1.1"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
xz2 = "0.1"
bzip2 = "0.6"
shlex = "1.3"
toml_edit = "0.23"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
