# rzpk jumps – macOS Alacritty TOML fragment
# Merge these settings into ~/.config/alacritty/alacritty.toml.
# If [window] or [keyboard] already exist, append the settings to those
# sections instead of declaring the same table twice.
#
# Option (⌥) must be sent as Alt. Use "OnlyLeft" if you want the
# right Option key available for macOS special character input.
[window]
option_as_alt = "Both"

# Cmd+1..9 normally selects Alacritty tabs. Forward these shortcuts as
# Alt+1..9 sequences instead. `mode = "Alt"` limits the override to
# applications using the alternate screen (including rzpk). It can also
# affect Cmd+digit in other full-screen terminal applications.
# The command bindings are still handled normally in the shell.

[[keyboard.bindings]]
key = "1"
mods = "Command"
mode = "Alt"
chars = "\u001b1"

[[keyboard.bindings]]
key = "2"
mods = "Command"
mode = "Alt"
chars = "\u001b2"

[[keyboard.bindings]]
key = "3"
mods = "Command"
mode = "Alt"
chars = "\u001b3"

[[keyboard.bindings]]
key = "4"
mods = "Command"
mode = "Alt"
chars = "\u001b4"

[[keyboard.bindings]]
key = "5"
mods = "Command"
mode = "Alt"
chars = "\u001b5"

[[keyboard.bindings]]
key = "6"
mods = "Command"
mode = "Alt"
chars = "\u001b6"

[[keyboard.bindings]]
key = "7"
mods = "Command"
mode = "Alt"
chars = "\u001b7"

[[keyboard.bindings]]
key = "8"
mods = "Command"
mode = "Alt"
chars = "\u001b8"

[[keyboard.bindings]]
key = "9"
mods = "Command"
mode = "Alt"
chars = "\u001b9"
